<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        .container {
            width: 50%; /* ajusta el ancho del contenedor según sea necesario */
            margin: auto;
            text-align: center;
        }

        .dynamic-text {
            font-size: 2vw; /* utiliza vw en lugar de em para ajustar el tamaño de fuente al ancho del contenedor */
            max-width: 100%; /* asegura que el texto no sobrepase el ancho del contenedor */
        }
    </style>
</head>
<body>
    <div class="container" style="width: 600px; height: 300px;">
        <p class="dynamic-text">Este es un texto que se ajusta dinámicamente al tamaño del contenedor.</p>
    </div>
    <div class="container" style="width: 200px; height: 100px;">
        <p class="dynamic-text">Este es un texto que se ajusta dinámicamente al tamaño del contenedor.</p>
    </div>
</body>
</html>
