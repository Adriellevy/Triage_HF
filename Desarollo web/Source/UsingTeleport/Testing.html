<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Button and Overlay Example</title>
    <style>
        /* Add some basic styling to the overlay */
        #overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.7);
            align-items: center;
            justify-content: center;
        }

        /* Add styling to the modal content */
        #modal-content {
            background-color: #fff;
            padding: 20px;
            border-radius: 15px;
            text-align: center;
        }
    </style>
</head>
<body>

    <!-- Button Element with onclick attribute -->
    <button onclick="showOverlay()">Click me</button>

    <!-- Overlay -->
    <div id="overlay">
        <!-- Modal Content -->
        <div id="modal-content">
            <p>This is the message you want to display.</p>
            <button onclick="hideOverlay()">Close</button>
        </div>
    </div>

    <script>
        // JavaScript functions to show and hide the overlay
        function showOverlay() {
            document.getElementById('overlay').style.display = 'flex';
        }

        function hideOverlay() {
            document.getElementById('overlay').style.display = 'none';
        }
    </script>

</body>
</html>
