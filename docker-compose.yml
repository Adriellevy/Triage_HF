services:
  mysqldb:
    image: mysql:8.0.33
    container_name: mysql_container
    environment:
      - MYSQL_ROOT_PASSWORD=1234
      - MYSQL_DATABASE=Triage_db
    ports:
      - 3307:3306
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - app-network

  api:
    container_name: server_api_container
    build:
      context: ./server/
    depends_on:
      - mysqldb
    links:
      - mysqldb
    environment:
      - DB_HOST=mysqldb
      - DB_USER=root
      - DB_PORT=3306
      - DB_PASSWORD=1234
      - DB_NAME=Triage_db
      - PORTAPI=3000
      - JWT_SECRET=123
      - EMAIL_USER=Test
      - EMAIL_PASS=Test
    ports:
      - 3000:3000
    networks:
      - app-network

  dataanalysisandreports:
    container_name: DataAnalysisAndReports_api_container
    build:
      context: ./DataAnalysisAndReports/src/
    depends_on:
      - mysqldb
    links:
      - mysqldb
    ports:
      - 5000:5000
    networks:
      - app-network

  triageapp:
    container_name: react_app_container
    build:
      context: ./triage-app/
    depends_on:
      - mysqldb
      - api
    links:
      - mysqldb
      - api
    ports:
      - 5173:5173
    networks:
      - app-network

networks:
  app-network:
    driver: bridge